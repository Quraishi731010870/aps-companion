openapi: 3.1.0
info:
  title: Afghan EMI Admin API
  version: 1.0.0
  description: Proposed contract only. No server implementing this contract is present.
servers:
  - url: https://admin-api.example.invalid/api/admin/v1
security:
  - adminSession: []
paths:
  /auth/csrf:
    get:
      security: []
      summary: Obtain pre-auth/session-bound CSRF token
      responses:
        '200':
          description: CSRF token for the browser session
          content:
            application/json:
              schema: { type: object, required: [csrfToken], properties: { csrfToken: { type: string } } }
  /auth/login:
    post:
      security: []
      summary: Authenticate administrator; response sets Secure HttpOnly cookie
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operator, password]
              properties:
                operator: { type: string, minLength: 1, maxLength: 254 }
                password: { type: string, minLength: 1, writeOnly: true }
      responses:
        '200':
          description: Authenticated administrator session
          headers:
            Set-Cookie: { schema: { type: string, example: '__Host-admin_session=opaque; Path=/; Secure; HttpOnly; SameSite=Strict' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/session:
    get:
      summary: Return current server-validated identity and effective permissions
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: Session revoked and cookie cleared }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /dashboard:
    get:
      x-required-permission: dashboard.view
      responses:
        '200':
          description: Server-computed aggregates only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /customers:
    get:
      x-required-permission: customers.view
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { in: query, name: search, schema: { type: string, maxLength: 200 } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: sort, schema: { type: string, enum: [createdAt:asc, createdAt:desc, name:asc, name:desc] } }
        - { in: query, name: dateFrom, schema: { type: string, format: date } }
        - { in: query, name: dateTo, schema: { type: string, format: date } }
        - { in: query, name: lastActivityFrom, schema: { type: string, format: date } }
        - { in: query, name: lastActivityTo, schema: { type: string, format: date } }
      responses:
        '200':
          description: Server-side paginated, role-filtered and masked customer records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/IntegrationUnavailable' }
  /customers/{id}:
    get:
      x-required-permission: customers.view
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        '200':
          description: Authorized profile with only masked contact/account data and activity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDetails' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '503': { $ref: '#/components/responses/IntegrationUnavailable' }
  /transactions:
    get:
      x-required-permission: transactions.view
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { in: query, name: sort, schema: { type: string, enum: [createdAt:asc, createdAt:desc, amount:asc, amount:desc] } }
        - { in: query, name: search, schema: { type: string, maxLength: 200 } }
        - { in: query, name: transactionId, schema: { type: string, maxLength: 128 } }
        - { in: query, name: reference, schema: { type: string, maxLength: 128 } }
        - { in: query, name: customer, schema: { type: string, maxLength: 128 } }
        - { in: query, name: account, schema: { type: string, maxLength: 128 } }
        - { in: query, name: phone, schema: { type: string, maxLength: 32 } }
        - { in: query, name: operation, schema: { type: string, enum: ['702', '651', '785', '781', '689', '774', '511', '512', '508', '618', '700'] } }
        - { in: query, name: status, schema: { type: string, enum: [processing, successful, failed, reversed] } }
        - { in: query, name: responseCode, schema: { type: string, maxLength: 32 } }
        - { in: query, name: dateFrom, schema: { type: string, format: date } }
        - { in: query, name: dateTo, schema: { type: string, format: date } }
        - { in: query, name: timeFrom, schema: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' } }
        - { in: query, name: timeTo, schema: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' } }
        - { in: query, name: amountFrom, schema: { type: number, minimum: 0 } }
        - { in: query, name: amountTo, schema: { type: number, minimum: 0 } }
        - { in: query, name: currency, schema: { type: string, maxLength: 3 } }
        - { in: query, name: channel, schema: { type: string, maxLength: 64 } }
        - { in: query, name: source, schema: { type: string, maxLength: 128 } }
        - { in: query, name: destination, schema: { type: string, maxLength: 128 } }
      responses:
        '200':
          description: Server-side filtered and paginated transactions from authoritative ledger
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/IntegrationUnavailable' }
  /transactions/{id}:
    get:
      x-required-permission: transactions.view
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        '200':
          description: Authorized transaction details with authoritative event timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
        '503': { $ref: '#/components/responses/IntegrationUnavailable' }
  /monitoring/overview:
    get:
      x-required-permission: monitoring.view
      responses:
        '200':
          description: Monitoring and integration state; missing signals use unavailable status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoringOverview' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /monitoring/transactions:
    get:
      x-required-permission: monitoring.view
      parameters:
        - { in: query, name: dateFrom, schema: { type: string, format: date } }
        - { in: query, name: dateTo, schema: { type: string, format: date } }
        - { in: query, name: operation, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: channel, schema: { type: string } }
        - { in: query, name: source, schema: { type: string } }
        - { in: query, name: destination, schema: { type: string } }
      responses:
        '200':
          description: Authoritative time-bucketed transaction telemetry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionMonitoring' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/IntegrationUnavailable' }
  /monitoring/alerts:
    get:
      x-required-permission: monitoring.view
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { in: query, name: severity, schema: { type: string, enum: [critical, high, medium, warning, info] } }
        - { in: query, name: source, schema: { type: string } }
        - { in: query, name: host, schema: { type: string, maxLength: 128 } }
        - { in: query, name: service, schema: { type: string, maxLength: 128 } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: dateFrom, schema: { type: string, format: date } }
        - { in: query, name: dateTo, schema: { type: string, format: date } }
      responses:
        '200':
          description: Server-side filtered monitoring alerts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/IntegrationUnavailable' }
components:
  securitySchemes:
    adminSession: { type: apiKey, in: cookie, name: __Host-admin_session }
  parameters:
    CsrfHeader: { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
  responses:
    Unauthorized:
      description: Session missing, expired, or invalid
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Forbidden:
      description: Authenticated administrator lacks required permission
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    RateLimited:
      description: Authentication rate limit exceeded
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    IntegrationUnavailable:
      description: Authoritative service is not configured or unavailable; never substitute prototype data
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  schemas:
    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
    AdminSession:
      type: object
      required: [adminId, displayName, role, permissions, expiresAt]
      properties:
        adminId: { type: string }
        displayName: { type: string }
        role: { type: string }
        permissions: { type: array, items: { type: string } }
        expiresAt: { type: string, format: date-time }
    Page:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: {} }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 0 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    Customer:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string }
        name: { type: string }
        phoneMasked: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }
    CustomerPage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/Customer' } } }
    CustomerDetails:
      allOf:
        - { $ref: '#/components/schemas/Customer' }
        - type: object
          properties:
            emailMasked: { type: string }
            accounts:
              type: array
              items:
                type: object
                required: [id, type, status]
                properties:
                  id: { type: string }
                  type: { type: string }
                  maskedNumber: { type: string }
                  currency: { type: string }
                  status: { type: string }
            activity:
              type: array
              items:
                type: object
                required: [id, event, at]
                properties:
                  id: { type: string }
                  event: { type: string }
                  at: { type: string, format: date-time }
    Transaction:
      type: object
      required: [id, operationCode, operationLabel, amount, currency, status, createdAt]
      properties:
        id: { type: string }
        rrn: { type: string }
        reference: { type: string }
        customer: { type: string }
        operationCode: { type: integer, enum: [702, 651, 785, 781, 689, 774, 511, 512, 508, 618, 700] }
        operationLabel: { type: string }
        amount: { type: number }
        currency: { type: string }
        status: { type: string, enum: [processing, successful, failed, reversed] }
        source: { type: string }
        destination: { type: string }
        channel: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        responseCode: { type: string }
        timeline: { type: array, items: { type: object, properties: { label: { type: string }, at: { type: string, format: date-time }, detail: { type: string } } } }
    TransactionPage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/Transaction' } } }
    DashboardSummary:
      type: object
      properties:
        customersTotal: { type: integer, minimum: 0 }
        customersActive: { type: integer, minimum: 0 }
        transactionsTotal: { type: integer, minimum: 0 }
        successRate: { type: number, minimum: 0, maximum: 100 }
        trend: { type: array, items: { type: object, properties: { label: { type: string }, value: { type: number } } } }
        services: { type: array, items: { $ref: '#/components/schemas/MonitoringService' } }
    MonitoringService:
      type: object
      required: [name, status]
      properties:
        name: { type: string }
        status: { type: string, enum: [healthy, warning, critical, unavailable] }
        checkedAt: { type: string, format: date-time }
        detail: { type: string }
    MonitoringOverview:
      type: object
      required: [services, integrations]
      properties:
        services: { type: array, items: { $ref: '#/components/schemas/MonitoringService' } }
        integrations: { type: object, required: [zabbix, grafana], properties: { zabbix: { type: string, enum: [healthy, warning, critical, unavailable] }, grafana: { type: string, enum: [healthy, warning, critical, unavailable] } } }
        infrastructure: { type: array, items: { type: object, required: [name, value, unit, status], properties: { name: { type: string }, value: { type: number }, unit: { type: string }, status: { type: string, enum: [healthy, warning, critical, unavailable] } } } }
        alerts: { type: object, properties: { critical: { type: integer }, high: { type: integer }, warning: { type: integer }, info: { type: integer } } }
    TransactionMonitoring:
      type: object
      required: [volume, successRate, failureRate, declineRate, pending, reversals]
      properties:
        volume: { type: integer, minimum: 0 }
        successRate: { type: number }
        failureRate: { type: number }
        declineRate: { type: number }
        pending: { type: integer, minimum: 0 }
        reversals: { type: integer, minimum: 0 }
        latencyMs: { type: number, minimum: 0 }
        trend: { type: array, items: { type: object, properties: { label: { type: string }, successful: { type: integer }, failed: { type: integer }, pending: { type: integer } } } }
        byType: { type: array, items: { type: object, properties: { label: { type: string }, count: { type: integer } } } }
        byResponseCode: { type: array, items: { type: object, properties: { label: { type: string }, count: { type: integer } } } }
        latencyTrend: { type: array, items: { type: object, properties: { label: { type: string }, milliseconds: { type: number } } } }
    Alert:
      type: object
      required: [id, source, description, severity, status, createdAt]
      properties:
        id: { type: string }
        source: { type: string }
        host: { type: string }
        service: { type: string }
        description: { type: string }
        severity: { type: string, enum: [critical, high, medium, warning, info] }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AlertPage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/Alert' } } }
